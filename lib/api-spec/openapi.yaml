openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /cyber/sources:
    get:
      operationId: getSources
      responses:
        "200":
          description: Source inventory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceInventory" }
  /cyber/sync:
    get:
      operationId: getSyncStatus
      responses:
        "200":
          description: Current in-process synchronization job; idle after server restart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncJob" }
    post:
      operationId: syncSources
      responses:
        "202":
          description: Started or reused the running synchronization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncJob" }
  /cyber/analyze:
    post:
      operationId: analyzeRisk
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiskInput" }
      responses:
        "200":
          description: AI proposals awaiting human review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskAnalysis" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    SyncJob:
      type: object
      required: [id, status, phase, discovered, processed, errors, currentFile, startedAt, finishedAt, error, hasInventory]
      properties:
        id: { type: string }
        status: { type: string, enum: [idle, running, succeeded, failed] }
        phase: { type: string, enum: [idle, inventory, pdf, complete] }
        discovered: { type: integer, minimum: 0 }
        processed: { type: integer, minimum: 0 }
        errors: { type: integer, minimum: 0 }
        currentFile: { type: string }
        startedAt: { type: string }
        finishedAt: { type: string }
        error: { type: string }
        hasInventory: { type: boolean }
    Source:
      type: object
      required: [id, name, folder, url, status, text, note]
      properties:
        id: { type: string }
        name: { type: string }
        folder: { type: string }
        url: { type: string }
        status: { type: string, enum: [read, partial, pending, error] }
        text: { type: string }
        note: { type: string }
    SourceInventory:
      type: object
      required: [sources, syncedAt, warning]
      properties:
        sources:
          type: array
          items: { $ref: "#/components/schemas/Source" }
        syncedAt: { type: string }
        warning: { type: string }
    RiskInput:
      type: object
      required: [title]
      description: Provide content for new analyses; legacy records may contain threat, vulnerability and information instead.
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        content: { type: string, minLength: 3, maxLength: 9000 }
        threat: { type: string, minLength: 3, maxLength: 3000 }
        vulnerability: { type: string, minLength: 3, maxLength: 3000 }
        information: { type: string, minLength: 3, maxLength: 3000 }
    Evidence:
      type: object
      required: [sourceId, sourceName, url, quote]
      properties:
        sourceId: { type: string }
        sourceName: { type: string }
        url: { type: string }
        quote: { type: string }
    Proposal:
      type: object
      required: [id, dimension, category, text, rationale, evidence]
      properties:
        id: { type: string }
        dimension: { type: string, enum: [principle, state, information, countermeasure] }
        category: { type: string }
        text: { type: string }
        rationale: { type: string }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/Evidence" }
    RiskAnalysis:
      type: object
      required: [id, createdAt, input, proposals, warning]
      properties:
        id: { type: string }
        createdAt: { type: string }
        input: { $ref: "#/components/schemas/RiskInput" }
        summary: { type: string, description: Integrated answer for the Summary page }
        proposals:
          type: array
          items: { $ref: "#/components/schemas/Proposal" }
        warning: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

